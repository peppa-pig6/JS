<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Loops</title>
    </head>
    <body>
        <h1>JavaScript for Loop</h1>
        <p id="demo"></p>

        <script>
            var fruits = ["Apple", "Banana", "Mango", "Orange", "Pineapple"];
            var text = "";
            var i;
            for (i = 0; i < fruits.length; i++) {
                text += fruits[i] + "<br>";
            }
            document.getElementById("demo").innerHTML = text;
        </script>
    </body>
</html>
