<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Favourite Person Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .profile-card { max-width: 500px; margin: 50px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-card">
            <h2 class="text-center mb-4">My Favourite Person Profile</h2>
            
            <ul class="list-group">
                <li class="list-group-item"><strong>Name (Dot Notation):</strong> <span id="nameDot"></span></li>
                <li class="list-group-item"><strong>Age (Bracket Notation):</strong> <span id="ageBracket"></span></li>
                <li class="list-group-item"><strong>Relationship (Dot Notation):</strong> <span id="relationDot"></span></li>
                <li class="list-group-item"><strong>Hobby (Bracket Notation):</strong> <span id="hobbyBracket"></span></li>
            </ul>
        </div>
    </div>

    <script>
        var person = {
            name: "Alex",
            age: 25,
            relation: "Best Friend",
            hobby: "Coding"
        };

        document.getElementById("nameDot").innerText = person.name;
        document.getElementById("ageBracket").innerText = person["age"];
        document.getElementById("relationDot").innerText = person.relation;
        document.getElementById("hobbyBracket").innerText = person["hobby"];
    </script>

</body>
</html>
