<!DOCTYPE html>
<html>

<head>
</head>

<body>
    <button onclick="multiply(4)">Click Me!</button>
    <p id="result"></p>

    <script>
        function multiply(a, b) {
            if (b === undefined) {
                b = 5;
            }
            var result = a * b;
            document.getElementById("result").innerHTML = "The result is: " + result;
        }
    </script>
</body>

</html>
